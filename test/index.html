<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Malibu — Test Run</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0f12;
    --panel: #17181c;
    --panel-2: #1f2025;
    --border: #2a2b30;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --accent: #5ea1ff;
    --ok: #35c759;
    --problem: #ff5a52;
    --open: #6b6c72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; }
  .center { text-align: center; padding: 60px 20px; color: var(--muted); }
  .error { color: var(--problem); }

  /* start form */
  .start-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .start-card label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .start-card input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 15px;
  }
  .btn {
    display: inline-block; margin-top: 16px; padding: 10px 18px;
    background: var(--accent); color: #06121f; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }

  /* progress */
  .progress-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
  .progress-track { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .2s ease; }
  .progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* filter chips */
  .chips { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; }
  .chip {
    padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  }
  .chip.active { background: var(--accent); color: #06121f; border-color: var(--accent); font-weight: 600; }

  /* sections */
  .section { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; user-select: none;
  }
  .section-head .title { font-weight: 600; font-size: 15px; }
  .section-head .count { color: var(--muted); font-size: 13px; }
  .section-body { border-top: 1px solid var(--border); }
  .section.collapsed .section-body { display: none; }
  .caret { transition: transform .15s ease; color: var(--muted); }
  .section.collapsed .caret { transform: rotate(-90deg); }

  .item { padding: 14px 16px; border-top: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item.hidden { display: none; }
  .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .item-feature { font-weight: 600; font-size: 14.5px; }
  .status-btn {
    flex-shrink: 0; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    border: 1px solid transparent; cursor: pointer;
  }
  .status-btn[data-status="open"] { background: var(--panel-2); color: var(--muted); border-color: var(--border); }
  .status-btn[data-status="ok"] { background: rgba(53,199,89,0.15); color: var(--ok); border-color: rgba(53,199,89,0.4); }
  .status-btn[data-status="problem"] { background: rgba(255,90,82,0.15); color: var(--problem); border-color: rgba(255,90,82,0.4); }

  .item-steps { margin: 10px 0 0; padding-left: 20px; color: var(--text); font-size: 14px; line-height: 1.6; }
  .item-expected { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .item-expected b { color: var(--text); font-weight: 600; }
  .item-note-label { font-size: 13px; color: var(--muted); }
  .item-note {
    margin-top: 8px;
    width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    font-size: 13.5px; font-family: inherit; resize: vertical;
  }

  .item-screenshot-row {
    margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-radius: 8px; border: 1px solid transparent; transition: border-color .1s ease, background .1s ease;
  }
  .item-screenshot-row.drag-active {
    border-color: var(--accent); background: rgba(94,161,255,0.08);
  }
  .screenshot-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--muted); font-size: 12.5px; cursor: pointer;
  }
  .screenshot-btn:hover { color: var(--text); border-color: #3a3b42; }
  .screenshot-thumb-wrap { position: relative; display: inline-block; }
  .screenshot-thumb {
    width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); display: block;
  }
  .screenshot-remove {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--problem); color: #fff; border: none;
    font-size: 11px; line-height: 18px; text-align: center; cursor: pointer; padding: 0;
  }
  .screenshot-status { font-size: 12px; color: var(--muted); }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; }
  .file-chip .screenshot-remove { position: static; flex-shrink: 0; }

  .finish-row {
    position: sticky; bottom: 0; margin-top: 24px; padding: 16px 16px 20px;
    background: linear-gradient(to bottom, transparent, var(--bg) 30%);
  }
  .saved-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  .done-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center">Loading test scenario…</div>
</div>

<script src="vendor/jszip.min.js"></script>
<script>
(function () {
  var API = "https://api.malibureview.app/api/test-run";
  var app = document.getElementById("app");

  var pathParts = location.pathname.split("/").filter(Boolean);
  var scenarioId = pathParts[1] || "";

  var storageKey = "malibu_test_run_" + scenarioId;
  var state = {
    scenario: null,
    runId: null,
    editToken: null,
    itemResults: {},
    filter: "all",
    collapsed: {}
  };

  function saveLocal() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        runId: state.runId, editToken: state.editToken, itemResults: state.itemResults
      }));
    } catch (e) {}
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(storageKey);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function flatItems() {
    var out = [];
    var idx = 0;
    (state.scenario.sections || []).forEach(function (section, sIdx) {
      (section.items || []).forEach(function (item) {
        out.push({ flatIndex: idx, sectionIdx: sIdx, item: item });
        idx++;
      });
    });
    return out;
  }

  function statusOf(flatIndex) {
    var r = state.itemResults[String(flatIndex)];
    return (r && r.status) || "open";
  }

  function noteOf(flatIndex) {
    var r = state.itemResults[String(flatIndex)];
    return (r && r.note) || "";
  }

  // Ticket #204 (Sam): a step used to carry at most one screenshot. Reads the new plural
  // "screenshots" array; falls back to wrapping the old singular "screenshot" key for runs
  // written before this change went live — same backward-compat contract the native app's
  // TestItemResult.init(from:) uses (see that file's own comment for why the fallback only
  // triggers when the new key is truly ABSENT, not just empty — an explicit [] must stick after
  // a removal, never resurrect the stale singular value).
  function screenshotsOf(flatIndex) {
    var r = state.itemResults[String(flatIndex)];
    if (!r) return [];
    if (Array.isArray(r.screenshots)) return r.screenshots;
    if (r.screenshot) return [r.screenshot];
    return [];
  }

  function fileOf(flatIndex) {
    var r = state.itemResults[String(flatIndex)];
    return (r && r.file) || null;
  }

  var screenshotPreviews = {};

  function nextStatus(s) {
    if (s === "open") return "ok";
    if (s === "ok") return "problem";
    return "open";
  }

  function setResult(flatIndex, patch) {
    var key = String(flatIndex);
    state.itemResults[key] = Object.assign({}, state.itemResults[key], patch);
    saveLocal();
    render();
    pushResult();
  }

  var pushTimer = null;
  function pushResult() {
    clearTimeout(pushTimer);
    var noteEl = document.getElementById("saved-note");
    if (noteEl) noteEl.textContent = "Saving…";
    pushTimer = setTimeout(function () {
      fetch(API + "/" + state.runId + "/result", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ edit_token: state.editToken, item_results: state.itemResults })
      }).then(function (r) {
        var el = document.getElementById("saved-note");
        if (!el) return;
        el.textContent = r.ok ? "Saved." : "Could not save — check your connection.";
      }).catch(function () {
        var el = document.getElementById("saved-note");
        if (el) el.textContent = "Could not save — check your connection.";
      });
    }, 350);
  }

  function progress() {
    var items = flatItems();
    var done = items.filter(function (fi) { return statusOf(fi.flatIndex) !== "open"; }).length;
    return { done: done, total: items.length };
  }

  function renderStart() {
    app.innerHTML =
      '<header><h1>' + escapeHtml(state.scenario.title) + '</h1>' +
      '<div class="sub">' + escapeHtml(state.scenario.app_module) + ' — Studio Malibu test run</div></header>' +
      '<div class="start-card">' +
      '<p style="margin:0;color:var(--muted);font-size:14px;line-height:1.5;">Walk through each item below and mark it OK or Problem as you go. Your name/email are optional — only used if we need to follow up on something you flagged.</p>' +
      '<label for="f-name">Name (optional)</label><input id="f-name" type="text" placeholder="Your name">' +
      '<label for="f-email">Email (optional)</label><input id="f-email" type="email" placeholder="you@example.com">' +
      '<button class="btn" id="start-btn">Start Testing</button>' +
      '</div>';
    document.getElementById("start-btn").onclick = function () {
      var btn = this;
      btn.disabled = true;
      btn.textContent = "Starting…";
      fetch(API + "/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          scenario_id: scenarioId,
          name: document.getElementById("f-name").value,
          email: document.getElementById("f-email").value
        })
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error((res.j && res.j.error) || "Could not start");
          state.runId = res.j.run_id;
          state.editToken = res.j.edit_token;
          state.itemResults = {};
          saveLocal();
          render();
        })
        .catch(function (e) {
          btn.disabled = false;
          btn.textContent = "Start Testing";
          alert(e.message || "Could not start the test run. Please try again.");
        });
    };
  }

  function itemMatchesFilter(flatIndex) {
    var s = statusOf(flatIndex);
    var n = noteOf(flatIndex);
    if (state.filter === "open") return s === "open";
    if (state.filter === "problems") return s === "problem";
    if (state.filter === "notes") return !!n;
    return true;
  }

  function renderRun() {
    var p = progress();
    var pct = p.total ? Math.round((p.done / p.total) * 100) : 0;

    var html = '<header><h1>' + escapeHtml(state.scenario.title) + '</h1>' +
      '<div class="sub">' + escapeHtml(state.scenario.app_module) + ' — Studio Malibu test run</div></header>';

    html += '<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-label">' + p.done + ' / ' + p.total + '</div></div>';

    html += '<div class="chips">' +
      chip("all", "All") + chip("open", "Open") + chip("notes", "With Note") + chip("problems", "Problems") +
      '</div>';

    (state.scenario.sections || []).forEach(function (section, sIdx) {
      var items = flatItems().filter(function (fi) { return fi.sectionIdx === sIdx; });
      var visibleCount = items.filter(function (fi) { return itemMatchesFilter(fi.flatIndex); }).length;
      var collapsed = !!state.collapsed[sIdx];
      html += '<div class="section' + (collapsed ? " collapsed" : "") + '" data-section="' + sIdx + '">';
      html += '<div class="section-head" data-toggle-section="' + sIdx + '">' +
        '<div class="title">' + escapeHtml(section.title) + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
        '<div class="count">' + items.filter(function (fi) { return statusOf(fi.flatIndex) !== "open"; }).length + '/' + items.length + '</div>' +
        '<div class="caret">▾</div></div></div>';
      html += '<div class="section-body">';
      items.forEach(function (fi) {
        var visible = itemMatchesFilter(fi.flatIndex);
        var status = statusOf(fi.flatIndex);
        var stepsHtml = String(fi.item.steps || "").split(/\n/).filter(Boolean)
          .map(function (line) { return "<li>" + escapeHtml(line.replace(/^\d+\.\s*/, "")) + "</li>"; }).join("");
        html += '<div class="item' + (visible ? "" : " hidden") + '" data-idx="' + fi.flatIndex + '">' +
          '<div class="item-top"><div class="item-feature">' + escapeHtml(fi.item.feature) + '</div>' +
          '<button class="status-btn" data-status="' + status + '" data-toggle-status="' + fi.flatIndex + '">' +
          (status === "open" ? "Open" : status === "ok" ? "OK" : "Problem") + '</button></div>' +
          '<ol class="item-steps">' + stepsHtml + '</ol>' +
          '<div class="item-expected"><b>Expected:</b> ' + escapeHtml(fi.item.expected) + '</div>' +
          (fi.item.note ? '<div class="item-expected"><b>Note:</b> ' + escapeHtml(fi.item.note) + '</div>' : '') +
          '<div class="item-note-label">Your notes</div>' +
          '<textarea class="item-note" data-note-for="' + fi.flatIndex + '" placeholder="Optional — describe what happened">' + escapeHtml(noteOf(fi.flatIndex)) + '</textarea>' +
          renderScreenshotRow(fi.flatIndex) +
          renderFileRow(fi.flatIndex) +
          '</div>';
      });
      html += '</div></div>';
    });

    html += '<div class="finish-row"><button class="btn" id="finish-btn">Finish Test Run</button>' +
      '<div class="saved-note" id="saved-note"></div></div>';

    app.innerHTML = html;
    wireRunEvents();
  }

  // Ticket #204 (Sam): a step can now carry several screenshots, not just one — the button is
  // always visible (re-labeled "Add another" once at least one is attached) instead of only
  // appearing when empty, and each thumbnail gets its own remove control.
  function renderScreenshotRow(flatIndex) {
    var filenames = screenshotsOf(flatIndex);
    var previews = screenshotPreviews[flatIndex] || {};
    var thumbs = filenames.map(function (filename) {
      var previewUrl = previews[filename];
      return '<div class="screenshot-thumb-wrap">' +
        (previewUrl
          ? '<img class="screenshot-thumb" src="' + previewUrl + '">'
          : '<div class="screenshot-thumb"></div>') +
        '<button type="button" class="screenshot-remove" data-remove-screenshot="' + flatIndex + '" data-remove-screenshot-file="' + escapeHtml(filename) + '">×</button>' +
        '</div>';
    }).join("");
    return '<div class="item-screenshot-row" data-screenshot-row="' + flatIndex + '">' +
      thumbs +
      '<label class="screenshot-btn">📎 ' + (filenames.length ? "Add another" : "Attach screenshot") +
      '<input type="file" accept="image/*" data-screenshot-for="' + flatIndex + '" style="display:none">' +
      '</label>' +
      '<span class="screenshot-status" data-screenshot-status="' + flatIndex + '">' + (filenames.length ? "" : "Or paste / drop an image here") + '</span>' +
      '</div>';
  }

  // Distinct from the screenshot row (Knut, 2026-08-19: separate "attach file" control, not
  // merged with the screenshot button) — arbitrary files (XML, layout files, etc.), plus whole
  // folders/bundles zipped client-side before upload (Sam's MalibuBurn layouts, which can't
  // travel any other way). Shows the actual filename, unlike the screenshot row, which never
  // shows one — a file's name usually carries real meaning ("layout.zip" vs "notes.xml").
  function renderFileRow(flatIndex) {
    var filename = fileOf(flatIndex);
    if (filename) {
      return '<div class="item-screenshot-row" data-file-row="' + flatIndex + '">' +
        '<span class="file-chip"><span class="screenshot-btn">📄 ' + escapeHtml(filename) + '</span>' +
        '<button type="button" class="screenshot-remove" data-remove-file="' + flatIndex + '">×</button></span>' +
        '</div>';
    }
    return '<div class="item-screenshot-row" data-file-row="' + flatIndex + '">' +
      '<label class="screenshot-btn">📎 Attach file' +
      '<input type="file" data-file-for="' + flatIndex + '" style="display:none">' +
      '</label>' +
      '<span class="screenshot-status" data-file-status="' + flatIndex + '">Or drop a file or folder here</span>' +
      '</div>';
  }

  function uploadScreenshot(flatIndex, file) {
    var statusEl = document.querySelector('[data-screenshot-status="' + flatIndex + '"]');
    if (statusEl) statusEl.textContent = "Uploading…";

    var body = new FormData();
    body.append("edit_token", state.editToken);
    body.append("screenshot", file);

    fetch(API + "/" + state.runId + "/screenshot", { method: "POST", body: body })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error) || "Upload failed");
        // Filename keyed by the SERVER-returned name (PocketBase renames uploads), not known
        // until now — appends to the existing list rather than replacing it (#204).
        if (!screenshotPreviews[flatIndex]) screenshotPreviews[flatIndex] = {};
        screenshotPreviews[flatIndex][res.j.filename] = URL.createObjectURL(file);
        setResult(flatIndex, { screenshots: screenshotsOf(flatIndex).concat([res.j.filename]) });
      })
      .catch(function (e) {
        alert(e.message || "Could not upload the screenshot. Please try again.");
        render();
      });
  }

  function uploadFile(flatIndex, file) {
    var statusEl = document.querySelector('[data-file-status="' + flatIndex + '"]');
    if (statusEl) statusEl.textContent = "Uploading…";

    var body = new FormData();
    body.append("edit_token", state.editToken);
    body.append("file", file, file.name);

    fetch(API + "/" + state.runId + "/file", { method: "POST", body: body })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error) || "Upload failed");
        setResult(flatIndex, { file: res.j.filename });
      })
      .catch(function (e) {
        alert(e.message || "Could not upload the file. Please try again.");
        render();
      });
  }

  function readDirEntries(dirReader) {
    return new Promise(function (resolve, reject) { dirReader.readEntries(resolve, reject); });
  }

  function fileFromEntry(fileEntry) {
    return new Promise(function (resolve, reject) { fileEntry.file(resolve, reject); });
  }

  // Recursive walk of a dropped folder's File and Directory Entries API tree (Sam's MalibuBurn
  // layouts — a folder can't be uploaded any other way). readEntries() can return a partial
  // batch per call, per spec — must keep calling until it returns empty, not just once.
  async function collectFilesFromDirectory(dirEntry, pathPrefix) {
    var reader = dirEntry.createReader();
    var collected = [];
    var batch;
    do {
      batch = await readDirEntries(reader);
      for (var i = 0; i < batch.length; i++) {
        var entry = batch[i];
        var entryPath = pathPrefix + entry.name;
        if (entry.isDirectory) {
          collected = collected.concat(await collectFilesFromDirectory(entry, entryPath + "/"));
        } else {
          collected.push({ path: entryPath, file: await fileFromEntry(entry) });
        }
      }
    } while (batch.length > 0);
    return collected;
  }

  async function zipDirectoryEntry(dirEntry) {
    var files = await collectFilesFromDirectory(dirEntry, dirEntry.name + "/");
    var zip = new JSZip();
    files.forEach(function (f) { zip.file(f.path, f.file); });
    var blob = await zip.generateAsync({ type: "blob" });
    return new File([blob], dirEntry.name + ".zip", { type: "application/zip" });
  }

  // Paste target = whichever item's note textarea currently has focus (data-note-for="N"); with
  // nothing focused there's no item to attach to, so the paste is ignored — same "no target, no
  // attach" behavior as the native app's Cmd+V handling. Registered once at top level (not
  // re-wired per render) since `paste` is a document-level event, unlike the click/drop handlers
  // in `wireRunEvents()` which must be re-attached after every `innerHTML` replace.
  function handlePaste(e) {
    var active = document.activeElement;
    var idx = active && active.getAttribute && active.getAttribute("data-note-for");
    if (idx == null) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image/") === 0) {
        var file = items[i].getAsFile();
        if (file) { e.preventDefault(); uploadScreenshot(idx, file); }
        return;
      }
    }
  }

  function chip(key, label) {
    return '<div class="chip' + (state.filter === key ? " active" : "") + '" data-filter="' + key + '">' + label + '</div>';
  }

  function wireRunEvents() {
    app.querySelectorAll("[data-filter]").forEach(function (el) {
      el.onclick = function () { state.filter = el.getAttribute("data-filter"); render(); };
    });
    app.querySelectorAll("[data-toggle-section]").forEach(function (el) {
      el.onclick = function () {
        var idx = el.getAttribute("data-toggle-section");
        state.collapsed[idx] = !state.collapsed[idx];
        render();
      };
    });
    app.querySelectorAll("[data-toggle-status]").forEach(function (el) {
      el.onclick = function () {
        var idx = el.getAttribute("data-toggle-status");
        setResult(idx, { status: nextStatus(statusOf(idx)) });
      };
    });
    app.querySelectorAll("[data-note-for]").forEach(function (el) {
      el.onblur = function () {
        var idx = el.getAttribute("data-note-for");
        setResult(idx, { note: el.value });
      };
    });
    app.querySelectorAll("[data-screenshot-for]").forEach(function (el) {
      el.onchange = function () {
        var idx = el.getAttribute("data-screenshot-for");
        if (el.files && el.files[0]) uploadScreenshot(idx, el.files[0]);
      };
    });
    app.querySelectorAll("[data-screenshot-row]").forEach(function (row) {
      var idx = row.getAttribute("data-screenshot-row");
      row.ondragover = function (e) { e.preventDefault(); row.classList.add("drag-active"); };
      row.ondragleave = function () { row.classList.remove("drag-active"); };
      row.ondrop = function (e) {
        e.preventDefault();
        row.classList.remove("drag-active");
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file && file.type.indexOf("image/") === 0) uploadScreenshot(idx, file);
      };
    });
    app.querySelectorAll("[data-remove-screenshot]").forEach(function (el) {
      el.onclick = function () {
        var idx = el.getAttribute("data-remove-screenshot");
        var filename = el.getAttribute("data-remove-screenshot-file");
        if (screenshotPreviews[idx]) delete screenshotPreviews[idx][filename];
        setResult(idx, { screenshots: screenshotsOf(idx).filter(function (f) { return f !== filename; }) });
      };
    });
    app.querySelectorAll("[data-file-for]").forEach(function (el) {
      el.onchange = function () {
        var idx = el.getAttribute("data-file-for");
        if (el.files && el.files[0]) uploadFile(idx, el.files[0]);
      };
    });
    app.querySelectorAll("[data-file-row]").forEach(function (row) {
      var idx = row.getAttribute("data-file-row");
      row.ondragover = function (e) { e.preventDefault(); row.classList.add("drag-active"); };
      row.ondragleave = function () { row.classList.remove("drag-active"); };
      row.ondrop = function (e) {
        e.preventDefault();
        row.classList.remove("drag-active");
        var items = e.dataTransfer && e.dataTransfer.items;
        var entry = items && items.length && items[0].webkitGetAsEntry ? items[0].webkitGetAsEntry() : null;
        if (entry && entry.isDirectory) {
          var statusEl = document.querySelector('[data-file-status="' + idx + '"]');
          if (statusEl) statusEl.textContent = "Zipping…";
          zipDirectoryEntry(entry)
            .then(function (zipFile) { uploadFile(idx, zipFile); })
            .catch(function (err) {
              alert(err.message || "Could not zip the folder. Please try again.");
              render();
            });
          return;
        }
        var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) uploadFile(idx, file);
      };
    });
    app.querySelectorAll("[data-remove-file]").forEach(function (el) {
      el.onclick = function () {
        var idx = el.getAttribute("data-remove-file");
        setResult(idx, { file: null });
      };
    });
    var finishBtn = document.getElementById("finish-btn");
    if (finishBtn) finishBtn.onclick = finish;
  }

  function finish() {
    var hasProblem = Object.keys(state.itemResults).some(function (k) { return state.itemResults[k].status === "problem"; });
    var btn = document.getElementById("finish-btn");
    btn.disabled = true;
    btn.textContent = "Finishing…";
    fetch(API + "/" + state.runId + "/complete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ edit_token: state.editToken, overall_status: hasProblem ? "problem" : "ok" })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error) || "Could not finish");
        try { localStorage.removeItem(storageKey); } catch (e) {}
        app.innerHTML = '<div class="done-card"><h1>Thanks for testing!</h1>' +
          '<p style="color:var(--muted);margin-top:8px;">Your results were sent to the Studio Malibu team' +
          (hasProblem ? " — we'll follow up on anything flagged as a problem." : ".") + '</p></div>';
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = "Finish Test Run";
        alert(e.message || "Could not finish the test run. Please try again.");
      });
  }

  function render() {
    if (!state.scenario) return;
    if (!state.runId) { renderStart(); } else { renderRun(); }
  }

  document.addEventListener("paste", handlePaste);

  if (!scenarioId) {
    app.innerHTML = '<div class="center error">No test scenario specified.</div>';
    return;
  }

  fetch(API + "/scenario/" + encodeURIComponent(scenarioId))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error((res.j && res.j.error) || "Scenario not found");
      state.scenario = res.j;
      var saved = loadLocal();
      if (saved && saved.runId) {
        state.runId = saved.runId;
        state.editToken = saved.editToken;
        state.itemResults = saved.itemResults || {};
      }
      render();
    })
    .catch(function (e) {
      app.innerHTML = '<div class="center error">' + escapeHtml(e.message || "Could not load this test scenario.") + '</div>';
    });
})();
</script>
</body>
</html>
