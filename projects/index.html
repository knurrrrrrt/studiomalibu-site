<style>
:root{
  --bg:#0C0B09; --panel:#151310; --card:#1A1815; --line:#2C2822;

  --gold:#D9A441; --gold-dim:#8A6A2E;
  --c-film:#D9714B; --c-film-txt:#3A1A0E;
  --c-stream:#5B8DD9; --c-stream-txt:#0E2340;
  --c-tv:#7BAE6F; --c-tv-txt:#173312;
  --c-doc:#C9A24A; --c-doc-txt:#3A2C0B;
  --c-com:#B07BC9; --c-com-txt:#2C1633;
}
:root[data-theme="light"]{
  --bg:#F7F3EA; --panel:#FFFFFF; --card:#FFFFFF; --line:#E4DDCC;
  --text:#241F17; --muted:#726A57; --dim:#A79E88;
  --gold:#A9762B; --gold-dim:#C79A4C;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F7F3EA; --panel:#FFFFFF; --card:#FFFFFF; --line:#E4DDCC;
    --text:#241F17; --muted:#726A57; --dim:#A79E88;
    --gold:#A9762B; --gold-dim:#C79A4C;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;}
a{color:inherit;}
.wrap{max-width:1100px;margin:0 auto;padding:2.2rem 2rem 5rem;}
.nav-back{display:inline-block;font-size:0.8rem;color:var(--muted);text-decoration:none;margin-bottom:1.1rem;}
.nav-back:hover{color:var(--text);}
.hero{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.1rem;}
h1{font-family:'Bebas Neue',sans-serif;font-size:2.1rem;line-height:1;letter-spacing:0.01em;margin:0;font-weight:400;}
.search-input{width:100%;max-width:320px;font:inherit;font-size:0.82rem;padding:0.5rem 0.8rem;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);}
.search-input::placeholder{color:var(--dim);}
.search-input:focus{outline:none;border-color:var(--gold-dim);}
#filters{display:flex;flex-direction:column;gap:0.5rem;padding-bottom:1.3rem;margin-bottom:1.6rem;border-bottom:1px solid var(--line);}
.filter-group{display:flex;align-items:center;gap:0.7rem;}
.filter-label{flex:0 0 auto;width:6.2rem;font-size:0.62rem;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);}
.filter-chips{display:flex;gap:0.35rem;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;white-space:nowrap;font-size:0.72rem;padding:0.28rem 0.65rem;border-radius:100px;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;}
.chip:hover{border-color:var(--gold-dim);color:var(--text);}
.chip.active{background:var(--gold);border-color:var(--gold);color:#1A1206;font-weight:600;}
@media(max-width:600px){h1{font-size:1.7rem;}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.3rem;perspective:1200px;}
.card-outer{display:flex;flex-direction:column;}
.card{aspect-ratio:2/3;position:relative;cursor:pointer;perspective:1200px;box-shadow:0 8px 24px rgba(0,0,0,0.35);border-radius:10px;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;}
.card.flipped .card-inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid var(--line);}
.front{background-color:#0A0908;}
.front-blur{position:absolute;inset:-8px;background-size:cover;background-position:center;filter:blur(18px) brightness(0.55);transform:scale(1.15);}
.front-sharp{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;}
.front.no-poster{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--card),#0A0908);}
.front.no-poster .no-poster-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--dim);text-align:center;padding:1rem;line-height:1.15;}
.flag-badge{position:absolute;top:0.7rem;right:0.7rem;font-size:1.15rem;line-height:1;background:rgba(10,9,7,0.55);border-radius:6px;padding:0.3rem 0.4rem;backdrop-filter:blur(3px);}
.back{background:var(--card);transform:rotateY(180deg);-webkit-transform:rotateY(180deg);padding:1.1rem;display:flex;flex-direction:column;overflow-y:auto;}
.back-title{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:0.01em;margin:0 0 0.7rem;line-height:1.05;color:var(--gold);}
.back-row{font-size:0.76rem;line-height:1.5;margin-bottom:0.5rem;}
.back-row .k{color:var(--dim);display:block;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;}
.back-row .v{color:var(--text);}
.award{font-size:0.68rem;color:var(--gold);margin-top:auto;padding-top:0.6rem;border-top:1px solid var(--line);line-height:1.4;}
.imdb{display:inline-block;margin-top:0.6rem;font-size:0.7rem;color:var(--gold);text-decoration:none;border:1px solid var(--gold-dim);padding:0.25rem 0.6rem;border-radius:5px;}
.imdb:hover{background:var(--gold);color:#1A1206;}
.card-info{margin-top:0.85rem;}
.card-info h3{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;font-weight:400;letter-spacing:0.01em;margin:0 0 0.2rem;color:var(--text);line-height:1.1;}
.card-info p{font-size:0.78rem;color:var(--muted);margin:0;}
.card-info .type{color:var(--gold);}
.count-note{margin-top:2.5rem;font-size:0.8rem;color:var(--dim);border-top:1px solid var(--line);padding-top:1.2rem;}
footer.site-footer{margin-top:3rem;font-size:0.8rem;color:var(--dim);}
footer.site-footer a{text-decoration:underline;color:var(--dim);}
</style>
</head>

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function hasVal(v){
  if (!v) return false;
  const t = String(v).trim().toLowerCase();
  return t !== '' && t !== 'n/a' && t !== 'na' && t !== 'none' && t !== '-';
}

PROJECTS.sort((a, b) => (Number(b.year) - Number(a.year)) || a.title.localeCompare(b.title));

const filterState = {continent:'All', type:'All', country:'All'};
let searchQuery = '';

function uniq(key){ return ['All', ...new Set(PROJECTS.map(p=>p[key]))].sort((a,b)=> a==='All'?-1:b==='All'?1:a.localeCompare(b)); }

function renderFilters(){
  const groups = [
    {key:'type', label:'Type of show', values: uniq('type')},
    {key:'continent', label:'Region', values: uniq('continent')},
    {key:'country', label:'Country', values: uniq('country')},
  ];
  document.getElementById('filters').innerHTML = groups.map(g => `
    <div class="filter-group">
      <span class="filter-label">${esc(g.label)}</span>
      <div class="filter-chips">${g.values.map(v => `<button class="chip ${filterState[g.key]===v?'active':''}" data-key="${g.key}" data-val="${esc(v)}">${esc(v)}</button>`).join('')}</div>
    </div>`).join('');
  document.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      filterState[btn.dataset.key] = btn.dataset.val;
      renderFilters();
      renderGrid();
    });
  });
}

function matchesSearch(p, q){
  if (!q) return true;
  const hay = [p.title, p.director, p.editor, p.distributor, p.production].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderGrid(){
  const q = searchQuery.trim().toLowerCase();
  const filtered = PROJECTS.filter(p =>
    (filterState.continent==='All' || p.continent===filterState.continent) &&
    (filterState.type==='All' || p.type===filterState.type) &&
    (filterState.country==='All' || p.country===filterState.country) &&
    matchesSearch(p, q)
  );
  document.getElementById('countNote').textContent = `Showing ${filtered.length} of ${PROJECTS.length} productions.`;
  document.getElementById('grid').innerHTML = filtered.map((p,i) => {
    const frontHtml = p.poster
      ? `<div class="front-blur" style="background-image:url('posters/${encodeURIComponent(p.poster)}');"></div>
         <div class="front-sharp" style="background-image:url('posters/${encodeURIComponent(p.poster)}');"></div>`
      : `<div class="no-poster-title">${esc(p.title)}</div>`;
    return `
    <div class="card-outer">
      <div class="card" data-i="${i}">
        <div class="card-inner">
          <div class="face front${p.poster ? '' : ' no-poster'}">
            ${frontHtml}
            <span class="flag-badge">${p.flag}</span>
          </div>
          <div class="face back">
            <div class="back-title">${esc(p.title)}</div>
            <div class="back-row"><span class="k">Director</span><span class="v">${esc(p.director) || '&mdash;'}</span></div>
            <div class="back-row"><span class="k">Editor</span><span class="v">${esc(p.editor) || '&mdash;'}</span></div>
            ${hasVal(p.assistant) ? `<div class="back-row"><span class="k">Assistant editor</span><span class="v">${esc(p.assistant)}</span></div>` : ''}
            <div class="back-row"><span class="k">Production</span><span class="v">${hasVal(p.production) ? esc(p.production) : '&mdash;'}</span></div>
            <div class="back-row"><span class="k">Distributor / client</span><span class="v">${hasVal(p.distributor) ? esc(p.distributor) : '&mdash;'}</span></div>
            ${p.genre.length ? `<div class="back-row"><span class="k">Genre</span><span class="v">${esc(p.genre.join(', '))}</span></div>` : ''}
            ${hasVal(p.imdb) ? `<a class="imdb" href="${esc(p.imdb)}" target="_blank" rel="noopener">IMDb &#8599;</a>` : ''}
            ${hasVal(p.award) ? `<div class="award">&#127942; ${esc(p.award)}</div>` : ''}
          </div>
        </div>
      </div>
      <div class="card-info">
        <h3>${esc(p.title)}</h3>
        <p><span class="type">${esc(p.year)}</span> &bull; ${esc(p.type)}</p>
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const nowFlipped = card.classList.toggle('flipped');
      clearTimeout(card._flipTimer);
      if (nowFlipped) {
        card._flipTimer = setTimeout(() => card.classList.remove('flipped'), 5000);
      }
    });
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderGrid();
});

renderFilters();
renderGrid();
</script>
